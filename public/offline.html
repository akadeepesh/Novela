<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fcfaf7;
        color: #251e19;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      main { max-width: 400px; text-align: center; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
      p { font-size: 15px; line-height: 1.6; color: #7d6a58; margin: 0 0 20px; }
      a {
        display: inline-block;
        background: #8e5138;
        color: #fcfaf7;
        text-decoration: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1e1e21; color: #ece6df; }
        p { color: #a8998a; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page hasn't been opened on this device yet, so it isn't available offline.
        Your writing is safe: it is stored on this device. Pages you've opened before still work.
      </p>
      <a href="/dashboard">Go to your books</a>
    </main>
  </body>
</html>
